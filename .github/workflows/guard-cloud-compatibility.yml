name: Guard cloud compatibility qualification
# Manual only. Requires separately approved remote commits; no push/dispatch was performed locally.
'on':
  workflow_dispatch:
    inputs:
      guardengine:
        description: 'Exact remotely available guardengine commit SHA (40 lowercase hex)'
        required: true
        type: string
      specguard:
        description: 'Exact remotely available specguard commit SHA (40 lowercase hex)'
        required: true
        type: string
      archguard:
        description: 'Exact remotely available archguard commit SHA (40 lowercase hex)'
        required: true
        type: string
      codeguard:
        description: 'Exact remotely available codeguard commit SHA (40 lowercase hex)'
        required: true
        type: string
      testguard:
        description: 'Exact remotely available testguard commit SHA (40 lowercase hex)'
        required: true
        type: string
      gitguard:
        description: 'Exact remotely available gitguard commit SHA (40 lowercase hex)'
        required: true
        type: string
      flowguard:
        description: 'Exact remotely available flowguard commit SHA (40 lowercase hex)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        repository: [guardengine, specguard, archguard, codeguard, testguard, gitguard, flowguard]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require immutable explicit revisions
        env:
          GUARD_INPUT_REVISIONS: ${{ toJSON(inputs) }}
        run: |
          python - <<'PYVALIDATE'
          import json, os, re
          refs = json.loads(os.environ['GUARD_INPUT_REVISIONS'])
          assert len(refs) == 7 and all(re.fullmatch(r'[0-9a-f]{40}', value) for value in refs.values()), 'Exact commit SHAs required; no moving branches or defaults'
          PYVALIDATE
      - name: Read pinned guardengine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: full-stack-plugins/guardengine
          ref: ${{ inputs.guardengine }}
          path: guardengine
          persist-credentials: false
          submodules: false
      - name: Read pinned specguard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: full-stack-plugins/specguard
          ref: ${{ inputs.specguard }}
          path: specguard
          persist-credentials: false
          submodules: false
      - name: Read pinned archguard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: full-stack-plugins/archguard
          ref: ${{ inputs.archguard }}
          path: archguard
          persist-credentials: false
          submodules: false
      - name: Read pinned codeguard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: full-stack-plugins/codeguard
          ref: ${{ inputs.codeguard }}
          path: codeguard
          persist-credentials: false
          submodules: false
      - name: Read pinned testguard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: full-stack-plugins/testguard
          ref: ${{ inputs.testguard }}
          path: testguard
          persist-credentials: false
          submodules: false
      - name: Read pinned gitguard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: full-stack-plugins/gitguard
          ref: ${{ inputs.gitguard }}
          path: gitguard
          persist-credentials: false
          submodules: false
      - name: Read pinned flowguard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: full-stack-plugins/flowguard
          ref: ${{ inputs.flowguard }}
          path: flowguard
          persist-credentials: false
          submodules: false
      - name: Install the declared compiler
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Record actual runner tools and revisions
        run: |
          rustc +1.99.0 --version
          cargo +1.99.0 --version
          git --version
          for repo in guardengine specguard archguard codeguard testguard gitguard flowguard; do git -C "$repo" rev-parse HEAD; done
      - name: Execute selected test profile without suppressing failures
        env:
          GUARD_SELECTED_REPOSITORY: ${{ matrix.repository }}
          GUARD_CHECKOUT_ROOT: ${{ github.workspace }}
          CARGO_BUILD_JOBS: '1'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: python guardengine/scripts/cloud_guard_matrix.py --repository "$GUARD_SELECTED_REPOSITORY" --root "$GUARD_CHECKOUT_ROOT" --run
