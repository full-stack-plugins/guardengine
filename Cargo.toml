[package]
name = "guardengine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic contract and evidence engine for Partme Guard"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
time = { version = "=0.3.44", features = ["parsing"] }

tempfile = "3"
