[package]
name = "guard-protocol"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Closed engineering guard v1 interchange contracts; parsing grants no authority"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
base64 = "=0.22.1"

serde_json_canonicalizer = "=0.3.2"
