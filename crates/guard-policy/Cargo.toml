[package]
name = "guard-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Pinned OPA policy execution; no domain policy ownership or execution grants"
[dependencies]
guard-protocol = { path = "../guard-protocol" }
guard-contract = { path = "../guard-contract" }
guard-plan = { path = "../guard-plan" }
guard-runner = { path = "../guard-runner" }
guard-store = { path = "../guard-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "=1.53.1", features = ["rt-multi-thread","macros","sync","time"] }
[features]
real-opa-tests = []

[dev-dependencies]
guard-subject = { path = "../guard-subject" }
