[package]
name = "guard-authority"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Independent signed approval verification; never issues execution grants"

[dependencies]
guard-protocol = { path = "../guard-protocol" }
guard-contract = { path = "../guard-contract" }
guard-plan = { path = "../guard-plan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }

[dev-dependencies]
ring = "0.17"
guard-subject = { path = "../guard-subject" }
guard-store = { path = "../guard-store" }
tempfile = "3"
sha2 = "0.10"
