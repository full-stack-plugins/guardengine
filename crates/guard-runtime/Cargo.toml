[package]
name = "guard-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Registered-plan native execution coordination; observations grant no authority"

[dependencies]
guard-protocol = { path = "../guard-protocol" }
guard-contract = { path = "../guard-contract" }
guard-plan = { path = "../guard-plan" }
guard-store = { path = "../guard-store" }
guard-runner = { path = "../guard-runner" }
guard-run-ledger = { path = "../guard-run-ledger" }
guard-subject = { path = "../guard-subject" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[features]
test-fixture = []

[[bin]]
name = "guard-runtime-fixture"
path = "tests/support/fixture.rs"
required-features = ["test-fixture"]
