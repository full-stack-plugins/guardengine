[package]
name = "guard-plan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Immutable pre-execution obligation plans; grants no execution authority"

[dependencies]
guard-protocol = { path = "../guard-protocol" }
guard-contract = { path = "../guard-contract" }
guard-subject = { path = "../guard-subject" }
guard-store = { path = "../guard-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
