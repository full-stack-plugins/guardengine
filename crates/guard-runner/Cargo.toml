[package]
name = "guard-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bounded local verifier processes; execution observations grant no authority"

[dependencies]
guard-protocol = { path = "../guard-protocol" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
sha2 = "0.10"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "guard-runner-fixture"
path = "tests/support/fixture.rs"
required-features = ["test-fixture"]

[features]
test-fixture = []
